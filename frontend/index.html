    <!-- FIX: Google Fonts <link> tags removed — fonts are now self-hosted
         via @fontsource (see index.css). This removes a full DNS + TLS +
         download round-trip to fonts.googleapis.com/fonts.gstatic.com on
         every visit, which measured ~2.5s combined under throttled Slow 4G
         testing. Same font files, same weights, just served from Vercel
         alongside everything else instead of a third-party CDN. -->

    <!-- PWA: installability -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#A9791E" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
